// 两级联动:选省份 → 刷新城市列表
const provSel = $("i-prov"), citySel = $("i-city");
provSel.innerHTML = Object.keys(AREA).map(p =>
  `<option value="${p}">${p === "不确定" ? "不确定(不做校正)" : p}</option>`).join("");
function fillCities() {
  const cities = AREA[provSel.value] || [];
  citySel.innerHTML = cities.length
    ? cities.map(c => `<option value="${c[1]},${c[2] || 8}">${c[0]}</option>`).join("")
    : `<option value="">—</option>`;
}
provSel.onchange = fillCities;
fillCities();
const EL_CN = { wood: "木", fire: "火", earth: "土", metal: "金", water: "水" };
const PILLAR_CN = { year: "年柱", month: "月柱", day: "日柱", hour: "时柱" };

// 切换按钮组
function bindToggle(id) {
  const box = $(id);
  box.querySelectorAll("button").forEach(b => b.onclick = () => {
    box.querySelectorAll("button").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
  });
}
bindToggle("cal-toggle"); bindToggle("g-toggle");
const toggleVal = id => $(id).querySelector(".on").dataset.v;

let currentChart = null; // 当前命盘,供解读使用

async function calc() {
  $("err").textContent = "";
  const body = {
    year: $("i-year").value, month: $("i-month").value, day: $("i-day").value,
    hour: $("i-hour").value, minute: $("i-minute").value || 0,
    gender: toggleVal("g-toggle"),
    calendarType: toggleVal("cal-toggle"),
  };
  if (!body.year || !body.month || !body.day || $("i-hour").value === "") {
    $("err").textContent = "请把年、月、日、时填完整";
    return;
  }
  const city = $("i-city").value;
  if (city) {
    const [lng, tz] = city.split(",");
    body.longitude = Number(lng); body.timezone = Number(tz);
  }
  try {
    const r = await fetch("/api/bazi", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const data = await r.json();
    if (!data.ok) throw new Error(data.error);
    render(data.chart);
  } catch (e) {
    $("err").textContent = e.message || "排盘失败,请重试";
  }
}

function render(c) {
  currentChart = c;
  // 重置解读区,准备接受新命盘的解读
  $("reading-result").style.display = "none";
  $("reading-result").innerHTML = "";
  $("reading-intro").style.display = "block";
  $("reading-btn").style.display = "block";
  $("reading-btn").disabled = false;
  $("reading-btn").textContent = "生成解读";
  $("ad-bottom").style.display = "none";
  // 基本信息
  const cal = c.calendar || {};
  const lunar = cal.lunar || {};
  const tst = c.solarTimeInfo || {};
  $("meta").innerHTML =
    `生肖属<b>${cal.zodiac || "—"}</b> · 日主 <b class="${c.dayMaster.element}">${c.dayMaster.char}${EL_CN[c.dayMaster.element]}</b>(${c.dayMaster.polarity === "yang" ? "阳" : "阴"})<br>` +
    `农历 ${lunar.year || "?"} 年${lunar.isLeapMonth ? "闰" : ""} ${lunar.month || "?"} 月 ${lunar.day || "?"} 日` +
    (tst.trueSolarTime ? ` · 真太阳时 ${tst.trueSolarTime}` : "");

  // 四柱
  $("cols").innerHTML = ["year", "month", "day", "hour"].map(k => {
    const p = c.pillars[k];
    const hid = (p.hiddenStems || []).map(h =>
      `<span class="${h.element}">${h.stem}</span>·${h.tenGod}`).join("<br>");
    return `
      <div class="pillar">
        <div class="t">${PILLAR_CN[k]}</div>
        <div class="god">${p.stemTenGod}</div>
        <div class="han ${p.element}">${p.stem}</div>
        <div class="han ${p.branchElement}">${p.branch}</div>
        <div class="hidden-stems">${hid}</div>
        <div class="nayin">${p.naYin}<br>${p.growthStage}</div>
      </div>`;
  }).join("");

  // 五行分布:统计天干 + 地支主气 + 藏干
  const count = { wood: 0, fire: 0, earth: 0, metal: 0, water: 0 };
  for (const k of ["year", "month", "day", "hour"]) {
    const p = c.pillars[k];
    count[p.element]++;
    count[p.branchElement]++;
    (p.hiddenStems || []).forEach(h => { if (!h.isMain) count[h.element] += 0.5; });
  }
  const max = Math.max(...Object.values(count));
  const COLOR = { wood: "var(--wood)", fire: "var(--fire)", earth: "var(--earth)", metal: "var(--metal)", water: "var(--water)" };
  $("bars").innerHTML = Object.entries(count).map(([el, n]) => `
    <div class="bar-row">
      <span class="k ${el}">${EL_CN[el]}</span>
      <div class="track"><div class="fill" style="width:${(n / max) * 100}%;background:${COLOR[el]}"></div></div>
      <span class="n">${n % 1 ? n.toFixed(1) : n}</span>
    </div>`).join("");

  // 大运
  const nowYear = new Date().getFullYear();
  const cycles = (c.daYun && c.daYun.cycles) || [];
  $("dayun").innerHTML = cycles.slice(0, 8).map(d => `
    <div class="dy ${nowYear >= d.startYear && nowYear <= d.endYear ? "now" : ""}">
      <div class="gz">${d.ganZhi}</div>
      <div class="age">${d.startAge}-${d.endAge} 岁<br>${d.startYear} 起<br>${d.stemTenGod}</div>
    </div>`).join("");

  // 地支互动
  const CN = { CLASH: "相冲", COMBINATION_2: "六合", TRINE: "三合", DIRECTIONAL: "三会", PUNISHMENT: "相刑", DESTRUCTION: "相破", HARM: "相害" };
  const inters = c.interactions || [];
  $("inter").innerHTML = inters.length
    ? inters.map(i => `<span class="tag">${(i.branches || []).join("")} ${CN[i.type] || i.type}</span>`).join("")
    : `<span style="color:var(--faint)">命局中无明显刑冲合害</span>`;
  $("inter-box").style.display = "block";

  $("form").style.display = "none";
  $("result").style.display = "block";
  window.scrollTo(0, 0);
}

async function getReading() {
  if (!currentChart) return;
  const btn = $("reading-btn");
  btn.disabled = true;
  btn.textContent = "正在推演命局,请稍候…";
  try {
    const r = await fetch("/api/interpret", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ chart: currentChart }),
    });
    const data = await r.json();
    if (!data.ok) throw new Error(data.error || "解读失败");
    $("reading-intro").style.display = "none";
    btn.style.display = "none";
    $("reading-result").innerHTML = data.sections.map(s => `
      <div style="margin-top:16px">
        <div style="font-size:14px;letter-spacing:2px;color:var(--cinnabar);border-left:3px solid var(--cinnabar);padding-left:10px">${s.title}</div>
        <p style="font-size:14px;line-height:2;margin-top:8px;color:var(--ink)">${s.text}</p>
      </div>`).join("") +
      `<p style="font-size:11px;color:var(--faint);margin-top:18px;text-align:center;letter-spacing:1px">解读仅供参考与娱乐 · 人生的选择权始终在你自己手里</p>`;
    $("reading-result").style.display = "block";
    $("ad-bottom").style.display = "flex"; // 解读生成后显示末尾广告位
  } catch (e) {
    btn.disabled = false;
    btn.textContent = "生成解读(点击重试)";
  }
}

function reset() {
  $("result").style.display = "none";
  $("form").style.display = "block";
  window.scrollTo(0, 0);
}
</script>

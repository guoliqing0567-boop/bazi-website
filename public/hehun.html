<style>
  /* 合婚页专有:契合度刻度盘 */
  .score-panel { margin-top: 24px; text-align: center; padding: 26px 20px;
    background: var(--pine); background-image: linear-gradient(160deg,var(--pine),var(--pine-2));
    color: var(--paper); position: relative; box-shadow: 0 10px 30px rgba(31,29,26,.22); }
  .score-panel::before { content:""; position:absolute; inset:8px;
    border:1px solid rgba(237,228,207,.20); pointer-events:none; }
  .score-panel .lbl { font-family: var(--sans); font-size: 11px; letter-spacing: 5px;
    color: rgba(237,228,207,.55); }
  .score-panel .num { font-size: 62px; font-weight: 700; line-height: 1; margin-top: 12px;
    color: var(--fire-l); }
  .score-panel .num small { font-size: 15px; letter-spacing: 2px; }
  .score-panel .track { height: 3px; background: rgba(237,228,207,.16); margin: 20px auto 16px;
    max-width: 260px; }
  .score-panel .fill { height: 100%; background: var(--fire-l); transition: width .8s cubic-bezier(.2,.8,.3,1); }
  .score-panel .verdict { font-size: 14px; line-height: 2; color: rgba(237,228,207,.85);
    max-width: 380px; margin: 0 auto; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; margin-top: 20px; }
  .pair .p { text-align: center; padding: 16px 10px; }
  .pair .p + .p { border-left: 1px solid var(--line); }
  .pair .who2 { font-family: var(--sans); font-size: 11px; letter-spacing: 3px; color: var(--ink-hint); }
  .pair .gz { font-size: 17px; line-height: 2; margin-top: 8px; letter-spacing: 1px; }
  .pair .dm { font-family: var(--sans); font-size: 12px; color: var(--ink-hint); margin-top: 6px; }
</style>
</head>
<body>

<header>
  <a class="wordmark" href="/">
    <h1>观命</h1>
    <span class="stamp">命</span>
  </a>
  <div class="tagline">八字合婚 · 契合度测算<span class="free-badge">完全免费</span></div>
  <hr class="rule-double">
</header>

<nav>
  <a href="/">排盘</a>
  <a href="/hehun.html" class="on">合婚</a>
  <a href="/today.html">黄历</a>
  <a href="/wiki">百科</a>
  <a href="/articles">文章</a>
</nav>

<main>
  <div class="ad-slot"><span>广告位 · AD</span></div>

  <div id="input-area">
    <div class="block">
      <div class="block-head"><h2>第一位 · 你</h2><span class="en">Person A</span></div>
      <div class="toggle" id="cal-a"><button class="on" data-v="solar">公历</button><button data-v="lunar">农历</button></div>
      <div class="field-grid" style="margin-top:20px">
        <div class="field"><label>年</label><input id="a-year" type="number" inputmode="numeric" placeholder="1995"></div>
        <div class="field"><label>月</label><input id="a-month" type="number" inputmode="numeric" placeholder="8"></div>
        <div class="field"><label>日</label><input id="a-day" type="number" inputmode="numeric" placeholder="15"></div>
        <div class="field"><label>时(0-23)</label><input id="a-hour" type="number" inputmode="numeric" placeholder="10"></div>
      </div>
      <div class="field-grid two" style="margin-top:18px">
        <div class="field"><label>性别</label>
          <div class="toggle" id="g-a" style="margin-top:1px"><button class="on" data-v="female">女</button><button data-v="male">男</button></div>
        </div>
      </div>
      <div class="field-grid two" style="margin-top:18px">
        <div class="field"><label>出生省份</label><select id="a-prov"></select></div>
        <div class="field"><label>出生城市</label><select id="a-city"></select></div>
      </div>
    </div>

    <div class="block">
      <div class="block-head"><h2>第二位 · 对方</h2><span class="en">Person B</span></div>
      <div class="toggle" id="cal-b"><button class="on" data-v="solar">公历</button><button data-v="lunar">农历</button></div>
      <div class="field-grid" style="margin-top:20px">
        <div class="field"><label>年</label><input id="b-year" type="number" inputmode="numeric" placeholder="1993"></div>
        <div class="field"><label>月</label><input id="b-month" type="number" inputmode="numeric" placeholder="3"></div>
        <div class="field"><label>日</label><input id="b-day" type="number" inputmode="numeric" placeholder="2"></div>
        <div class="field"><label>时(0-23)</label><input id="b-hour" type="number" inputmode="numeric" placeholder="16"></div>
      </div>
      <div class="field-grid two" style="margin-top:18px">
        <div class="field"><label>性别</label>
          <div class="toggle" id="g-b" style="margin-top:1px"><button data-v="female">女</button><button class="on" data-v="male">男</button></div>
        </div>
      </div>
      <div class="field-grid two" style="margin-top:18px">
        <div class="field"><label>出生省份</label><select id="b-prov"></select></div>
        <div class="field"><label>出生城市</label><select id="b-city"></select></div>
      </div>
    </div>

    <button class="go" onclick="calc()">开 始 合 婚</button>
    <p class="hint" style="text-align:center;margin-top:12px">免费测算,无需注册,结果立即显示</p>
    <div class="err" id="err"></div>
  </div>

  <div id="result" style="display:none">
    <div class="score-panel">
      <div class="lbl">契 合 度</div>
      <div class="num" id="score">—<small>分</small></div>
      <div class="track"><div class="fill" id="bar" style="width:0"></div></div>
      <div class="verdict" id="verdict"></div>
    </div>

    <div class="pair">
      <div class="p"><div class="who2">你</div><div class="gz" id="a-gz"></div><div class="dm" id="a-dm"></div></div>
      <div class="p"><div class="who2">对方</div><div class="gz" id="b-gz"></div><div class="dm" id="b-dm"></div></div>
    </div>

    <div class="block">
      <div class="block-head"><h2>逐项分析</h2><span class="en">Breakdown</span></div>
      <div id="items"></div>
    </div>

    <div class="ad-slot"><span>广告位 · AD</span></div>
    <a class="cta" href="/">排一张自己的完整命盘</a>
    <button class="ghost" onclick="reset()">重新测算</button>
  </div>
</main>

<p class="foot">
  <b style="color:var(--seal);font-weight:400">全站免费 · 不收费 · 不需要注册</b><br>
  排盘计算基于 OpenFate 开源引擎(@openfate/bazi-engine,MIT 协议)<br>
  合婚结果仅供参考与娱乐 · 感情的走向由两个人共同决定
</p>

<script src="/cities.js"></script>
<script>
const $ = id => document.getElementById(id);
const EL_CN = { wood:"木", fire:"火", earth:"土", metal:"金", water:"水" };

function bindToggle(id) {
  const box = $(id);
  box.querySelectorAll("button").forEach(b => b.onclick = () => {
    box.querySelectorAll("button").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
  });
}
["cal-a","cal-b","g-a","g-b"].forEach(bindToggle);
const toggleVal = id => $(id).querySelector(".on").dataset.v;

// 两组省市联动
function setupArea(prefix) {
  const prov = $(prefix + "-prov"), city = $(prefix + "-city");
  prov.innerHTML = Object.keys(AREA).map(p =>
    `<option value="${p}">${p === "不确定" ? "不确定(不校正)" : p}</option>`).join("");
  const fill = () => {
    const cs = AREA[prov.value] || [];
    city.innerHTML = cs.length
      ? cs.map(c => `<option value="${c[1]},${c[2] || 8}">${c[0]}</option>`).join("")
      : `<option value="">—</option>`;
  };
  prov.onchange = fill;
  fill();
}
setupArea("a"); setupArea("b");

function collect(prefix, calId, gId) {
  const o = {
    year: $(prefix + "-year").value, month: $(prefix + "-month").value,
    day: $(prefix + "-day").value, hour: $(prefix + "-hour").value,
    gender: toggleVal(gId), calendarType: toggleVal(calId),
  };
  const c = $(prefix + "-city").value;
  if (c) { const [lng, tz] = c.split(","); o.longitude = Number(lng); o.timezone = Number(tz); }
  return o;
}

async function calc() {
  $("err").textContent = "";
  const a = collect("a", "cal-a", "g-a"), b = collect("b", "cal-b", "g-b");
  for (const o of [a, b]) {
    if (!o.year || !o.month || !o.day || o.hour === "") {
      $("err").textContent = "请把双方的年月日时都填完整";
      return;
    }
  }
  try {
    const r = await fetch("/api/hehun", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ a, b }),
    });
    const d = await r.json();
    if (!d.ok) throw new Error(d.error);
    render(d);
  } catch (e) {
    $("err").textContent = e.message || "测算失败,请重试";
  }
}

function render(d) {
  const r = d.result;
  $("score").innerHTML = r.score + '<small>分</small>';
  $("bar").style.width = r.score + "%";
  $("verdict").textContent = r.verdict;
  const gz = c => ["year","month","day","hour"].map(k => c.pillars[k].ganZhi).join("<br>");
  $("a-gz").innerHTML = gz(d.a);
  $("b-gz").innerHTML = gz(d.b);
  const dm = c => `日主 ${c.dayMaster.char}${EL_CN[c.dayMaster.element]} · 属${(c.calendar && c.calendar.zodiac) || "—"}`;
  $("a-dm").textContent = dm(d.a);
  $("b-dm").textContent = dm(d.b);
  $("items").innerHTML = r.items.map(i =>
    `<div class="reading-sec"><h4>${i.title}</h4><p>${i.text}</p></div>`).join("");
  $("input-area").style.display = "none";
  $("result").style.display = "block";
  window.scrollTo(0, 0);
}

function reset() {
  $("result").style.display = "none";
  $("input-area").style.display = "block";
  window.scrollTo(0, 0);
}
</script>
</body>

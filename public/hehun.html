<style>
  :root {
    --ink:#22302C; --paper:#F5F0E4; --paper-2:#EDE6D4; --cinnabar:#B8432F;
    --faint:#8C8474; --line:#D8CFBB; --gold:#E8C56B;
    --wood:#3F7A54; --fire:#B8432F; --earth:#A67C2E; --metal:#8B8578; --water:#33566E;
  }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body { font-family:"Songti SC","Noto Serif SC","STSong",serif; background:var(--ink); color:var(--paper);
    min-height:100vh; max-width:560px; margin:0 auto; padding-bottom:60px; }
  header { text-align:center; padding:38px 20px 6px; }
  header a.logo { color:var(--paper); text-decoration:none; }
  h1.site { font-size:26px; letter-spacing:12px; text-indent:12px; font-weight:700; }
  .sub { color:rgba(245,240,228,.5); font-size:12px; margin-top:8px; letter-spacing:3px; }
  nav { text-align:center; margin-top:16px; font-size:14px; letter-spacing:2px; }
  nav a { color:rgba(245,240,228,.7); text-decoration:none; margin:0 10px; }
  nav a.on { color:var(--gold); }
  .ad-slot { margin:14px 18px; border-radius:14px; min-height:72px; display:flex; align-items:center;
    justify-content:center; background:rgba(245,240,228,.06); border:1px dashed rgba(245,240,228,.18); }
  .ad-slot span { color:rgba(245,240,228,.28); font-size:11px; letter-spacing:3px; }
  .form { background:var(--paper); color:var(--ink); border-radius:18px; margin:16px 18px; padding:20px; }
  .who { font-size:15px; letter-spacing:3px; color:var(--cinnabar); border-left:3px solid var(--cinnabar);
    padding-left:10px; margin-bottom:6px; }
  .f-row { display:flex; gap:10px; }
  .f-row > div { flex:1; }
  label { font-size:13px; color:var(--faint); display:block; margin:12px 0 5px; letter-spacing:1px; }
  input, select { width:100%; border:1px solid var(--line); background:#FBF8F0; border-radius:10px;
    padding:11px 12px; font-size:16px; font-family:inherit; color:var(--ink); }
  .toggle { display:flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; margin-top:4px; }
  .toggle button { flex:1; border:none; background:#FBF8F0; padding:11px 0; font-size:15px;
    font-family:inherit; cursor:pointer; color:var(--faint); }
  .toggle button.on { background:var(--ink); color:var(--paper); }
  .go { width:calc(100% - 36px); margin:6px 18px 0; border:none; border-radius:12px; background:var(--cinnabar);
    color:var(--paper); font-size:17px; letter-spacing:6px; text-indent:6px; padding:15px 0;
    font-family:inherit; cursor:pointer; display:block; }
  .err { color:#E8A090; font-size:14px; margin:10px 18px 0; text-align:center; }
  #result { display:none; }
  .score-card { background:var(--paper); color:var(--ink); border-radius:18px; margin:16px 18px;
    padding:24px 20px; text-align:center; }
  .score-num { font-size:52px; font-weight:700; color:var(--cinnabar); line-height:1; }
  .score-num small { font-size:16px; }
  .score-bar { height:8px; background:var(--paper-2); border-radius:4px; margin:16px 0 12px; overflow:hidden; }
  .score-bar div { height:100%; background:linear-gradient(90deg,var(--gold),var(--cinnabar)); border-radius:4px; }
  .verdict { font-size:14px; line-height:1.9; color:var(--ink); }
  .pair { display:flex; gap:10px; margin:0 18px 12px; }
  .pair .p { flex:1; background:var(--paper); color:var(--ink); border-radius:14px; padding:14px; text-align:center; }
  .pair .p .who2 { font-size:12px; color:var(--faint); letter-spacing:2px; }
  .pair .p .gz { font-size:15px; margin-top:8px; line-height:1.9; letter-spacing:1px; }
  .pair .p .dm { font-size:12px; color:var(--faint); margin-top:6px; }
  .section { background:var(--paper); color:var(--ink); border-radius:18px; margin:0 18px 12px; padding:18px 20px; }
  .section h3 { font-size:14px; letter-spacing:2px; color:var(--cinnabar); margin-bottom:8px;
    border-left:3px solid var(--cinnabar); padding-left:10px; }
  .section p { font-size:14px; line-height:2; }
  .section p b { color:var(--cinnabar); }
  .again { display:block; margin:16px auto 0; background:none; border:1px solid rgba(245,240,228,.35);
    color:var(--paper); border-radius:20px; padding:9px 26px; font-size:14px; font-family:inherit;
    cursor:pointer; letter-spacing:2px; }
  .foot { text-align:center; color:rgba(245,240,228,.4); font-size:11px; margin-top:26px;
    line-height:2; letter-spacing:1px; padding:0 24px; }

<body>

<header>
  <a class="logo" href="/"><h1 class="site">观 命</h1></a>
  <div class="sub">八字合婚 · 契合度测算</div>
  <nav>
    <a href="/">排盘</a>
    <a href="/hehun.html" class="on">合婚</a>
    <a href="/today.html">黄历</a>
    <a href="/wiki">百科</a>
    <a href="/articles">文章</a>
  </nav>
</header>

<div class="ad-slot"><span>广告位 · AD</span></div>

<div id="input-area">
  <div class="form">
    <div class="who">第一位 · 你</div>
    <div class="toggle" id="cal-a">
      <button class="on" data-v="solar">公历</button><button data-v="lunar">农历</button>
    </div>
    <div class="f-row">
      <div><label>年</label><input id="a-year" type="number" inputmode="numeric" placeholder="1995"></div>
      <div><label>月</label><input id="a-month" type="number" inputmode="numeric" placeholder="8"></div>
      <div><label>日</label><input id="a-day" type="number" inputmode="numeric" placeholder="15"></div>
      <div><label>时(0-23)</label><input id="a-hour" type="number" inputmode="numeric" placeholder="10"></div>
    </div>
    <label>性别</label>
    <div class="toggle" id="g-a"><button class="on" data-v="female">女</button><button data-v="male">男</button></div>
    <div class="f-row">
      <div><label>省份/地区</label><select id="a-prov"></select></div>
      <div><label>城市</label><select id="a-city"></select></div>
    </div>
  </div>

  <div class="form">
    <div class="who">第二位 · 对方</div>
    <div class="toggle" id="cal-b">
      <button class="on" data-v="solar">公历</button><button data-v="lunar">农历</button>
    </div>
    <div class="f-row">
      <div><label>年</label><input id="b-year" type="number" inputmode="numeric" placeholder="1993"></div>
      <div><label>月</label><input id="b-month" type="number" inputmode="numeric" placeholder="3"></div>
      <div><label>日</label><input id="b-day" type="number" inputmode="numeric" placeholder="2"></div>
      <div><label>时(0-23)</label><input id="b-hour" type="number" inputmode="numeric" placeholder="16"></div>
    </div>
    <label>性别</label>
    <div class="toggle" id="g-b"><button data-v="female">女</button><button class="on" data-v="male">男</button></div>
    <div class="f-row">
      <div><label>省份/地区</label><select id="b-prov"></select></div>
      <div><label>城市</label><select id="b-city"></select></div>
    </div>
  </div>

  <button class="go" onclick="calc()">开 始 合 婚</button>
  <div class="err" id="err"></div>
</div>

<div id="result">
  <div class="score-card">
    <div style="font-size:12px;letter-spacing:4px;color:var(--faint)">契 合 度</div>
    <div class="score-num" id="score">—<small>分</small></div>
    <div class="score-bar"><div id="bar" style="width:0"></div></div>
    <div class="verdict" id="verdict"></div>
  </div>
  <div class="pair">
    <div class="p"><div class="who2">你</div><div class="gz" id="a-gz"></div><div class="dm" id="a-dm"></div></div>
    <div class="p"><div class="who2">对方</div><div class="gz" id="b-gz"></div><div class="dm" id="b-dm"></div></div>
  </div>
  <div id="items"></div>
  <div class="ad-slot"><span>广告位 · AD</span></div>
  <button class="again" onclick="reset()">重新测算</button>
</div>

<p class="foot">
  排盘计算基于 OpenFate 开源引擎(@openfate/bazi-engine,MIT 协议)<br>
  合婚结果仅供参考与娱乐 · 感情的走向由两个人共同决定
</p>

<script src="/cities.js"></script>
<script>
const $ = id => document.getElementById(id);
const EL_CN = { wood:"木", fire:"火", earth:"土", metal:"金", water:"水" };

function bindToggle(id) {
  const box = $(id);
  box.querySelectorAll("button").forEach(b => b.onclick = () => {
    box.querySelectorAll("button").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
  });
}
["cal-a","cal-b","g-a","g-b"].forEach(bindToggle);
const toggleVal = id => $(id).querySelector(".on").dataset.v;

// 两组省市联动
function setupArea(prefix) {
  const prov = $(prefix + "-prov"), city = $(prefix + "-city");
  prov.innerHTML = Object.keys(AREA).map(p =>
    `<option value="${p}">${p === "不确定" ? "不确定(不校正)" : p}</option>`).join("");
  const fill = () => {
    const cs = AREA[prov.value] || [];
    city.innerHTML = cs.length
      ? cs.map(c => `<option value="${c[1]},${c[2] || 8}">${c[0]}</option>`).join("")
      : `<option value="">—</option>`;
  };
  prov.onchange = fill;
  fill();
}
setupArea("a"); setupArea("b");

function collect(prefix, calId, gId) {
  const o = {
    year: $(prefix + "-year").value, month: $(prefix + "-month").value,
    day: $(prefix + "-day").value, hour: $(prefix + "-hour").value,
    gender: toggleVal(gId), calendarType: toggleVal(calId),
  };
  const c = $(prefix + "-city").value;
  if (c) { const [lng, tz] = c.split(","); o.longitude = Number(lng); o.timezone = Number(tz); }
  return o;
}

async function calc() {
  $("err").textContent = "";
  const a = collect("a", "cal-a", "g-a"), b = collect("b", "cal-b", "g-b");
  for (const o of [a, b]) {
    if (!o.year || !o.month || !o.day || o.hour === "") {
      $("err").textContent = "请把双方的年月日时都填完整";
      return;
    }
  }
  try {
    const r = await fetch("/api/hehun", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ a, b }),
    });
    const d = await r.json();
    if (!d.ok) throw new Error(d.error);
    render(d);
  } catch (e) {
    $("err").textContent = e.message || "测算失败,请重试";
  }
}

function render(d) {
  const r = d.result;
  $("score").innerHTML = r.score + '<small>分</small>';
  $("bar").style.width = r.score + "%";
  $("verdict").textContent = r.verdict;
  const gz = c => ["year","month","day","hour"].map(k => c.pillars[k].ganZhi).join("<br>");
  $("a-gz").innerHTML = gz(d.a);
  $("b-gz").innerHTML = gz(d.b);
  const dm = c => `日主 ${c.dayMaster.char}${EL_CN[c.dayMaster.element]} · 属${(c.calendar && c.calendar.zodiac) || "—"}`;
  $("a-dm").textContent = dm(d.a);
  $("b-dm").textContent = dm(d.b);
  $("items").innerHTML = r.items.map(i =>
    `<div class="section"><h3>${i.title}</h3><p>${i.text}</p></div>`).join("");
  $("input-area").style.display = "none";
  $("result").style.display = "block";
  window.scrollTo(0, 0);
}

function reset() {
  $("result").style.display = "none";
  $("input-area").style.display = "block";
  window.scrollTo(0, 0);
}
</script>
</body>
